[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "handwritten-digit-recognizer"
version = "0.1.0"
description = "Train a CNN to recognize handwritten digits with MNIST."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pandas>=2.2",
    "streamlit>=1.32",
]

[tool.setuptools.packages.find]
where = ["src"]

